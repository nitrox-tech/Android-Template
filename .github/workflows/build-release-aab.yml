name: Build AAB

on:
  workflow_dispatch:
    inputs:
      expected_sha1:
        description: 'Expected SHA1 fingerprint of keystore (optional – for first-time verification)'
        required: false
        type: string

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version info
        id: version
        run: |
          APP_NAME=$(grep 'val baseAppName' app/build.gradle.kts | grep -oP '(?<=")[^"]+(?=")' | head -1)
          PROJECT_ID=$(grep 'val projectId' app/build.gradle.kts | grep -oP '(?<=")[^"]+(?=")' | head -1)
          VERSION_MAJOR=$(grep 'val versionMajor' app/build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_MINOR=$(grep 'val versionMinor' app/build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_PATCH=$(grep 'val versionPatch' app/build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_BUILD=$(grep 'val versionBuild' app/build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          VERSION_CODE=$((VERSION_MAJOR * 1000000 + VERSION_MINOR * 10000 + VERSION_PATCH * 100 + VERSION_BUILD))
          FLAVOR_NAME="prodFree"
          BUILD_TYPE="release"
          FILE_NAME="${PROJECT_ID}-v${VERSION_NAME}(${VERSION_CODE})-${FLAVOR_NAME}-${BUILD_TYPE}"

          echo "app_name=$APP_NAME"           >> $GITHUB_OUTPUT
          echo "project_id=$PROJECT_ID"       >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME"   >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE"   >> $GITHUB_OUTPUT
          echo "flavor_name=$FLAVOR_NAME"     >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME"         >> $GITHUB_OUTPUT

          echo "📦 App       : $APP_NAME"
          echo "🧩 Project   : $PROJECT_ID"
          echo "🔢 Version   : v${VERSION_NAME} (${VERSION_CODE})"
          echo "🧪 Flavor    : ${FLAVOR_NAME}"
          echo "🏷️  Build type: ${BUILD_TYPE}"
          echo "📄 File name : ${FILE_NAME}"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Verify SHA1 Fingerprint
        id: sha1_check
        run: |
          EXPECTED="${{ github.event.inputs.expected_sha1 }}"

          ACTUAL=$(keytool -list -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            2>/dev/null | grep "SHA1:" | awk '{print $2}')

          echo "actual_sha1=$ACTUAL" >> $GITHUB_OUTPUT

          if [ -z "$EXPECTED" ]; then
            # ── Case 3: Skipped ──────────────────────────────────────────────
            echo "sha1_status=skipped" >> $GITHUB_OUTPUT
            echo "::warning::⚠️ SHA1 verification skipped – no fingerprint provided."

            {
              echo "## ⚠️ SHA1 Verification: SKIPPED"
              echo ""
              echo "Không có SHA1 fingerprint được nhập. Verification bị bỏ qua."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Keystore SHA1 thực tế | \`$ACTUAL\` |"
              echo "| Trạng thái | ⚠️ Chưa xác minh |"
              echo ""
              echo "> 💡 **Tip:** Nhập SHA1 ở lần build đầu tiên để đảm bảo đúng keystore."
            } >> $GITHUB_STEP_SUMMARY

          else
            # Normalize (uppercase, strip colons)
            EXP_CLEAN=$(echo "$EXPECTED" | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d ' ')
            ACT_CLEAN=$(echo "$ACTUAL"   | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d ' ')

            if [ "$EXP_CLEAN" = "$ACT_CLEAN" ]; then
              # ── Case 2: Passed ────────────────────────────────────────────
              echo "sha1_status=passed" >> $GITHUB_OUTPUT
              echo "✅ SHA1 match: $ACTUAL"

              {
                echo "## ✅ SHA1 Verification: PASSED"
                echo ""
                echo "Keystore fingerprint khớp với SHA1 đã nhập."
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| SHA1 mong đợi | \`$EXPECTED\` |"
                echo "| SHA1 thực tế  | \`$ACTUAL\`   |"
                echo "| Trạng thái    | ✅ Khớp       |"
              } >> $GITHUB_STEP_SUMMARY

            else
              # ── Case 1: Failed ────────────────────────────────────────────
              echo "sha1_status=failed" >> $GITHUB_OUTPUT
              echo "::error::❌ SHA1 mismatch! Expected: $EXPECTED | Actual: $ACTUAL"

              {
                echo "## ❌ SHA1 Verification: FAILED"
                echo ""
                echo "**Fingerprint của keystore KHÔNG khớp với SHA1 đã nhập.**"
                echo "Build đã bị dừng để tránh ký sai keystore."
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| SHA1 mong đợi | \`$EXPECTED\` |"
                echo "| SHA1 thực tế  | \`$ACTUAL\`   |"
                echo "| Trạng thái    | ❌ Không khớp |"
                echo ""
                echo "> ❗ **Kiểm tra lại** secret \`ANDROID_KEYSTORE_BASE64\` xem có đúng keystore không."
              } >> $GITHUB_STEP_SUMMARY

              exit 1
            fi
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build protected AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:resChiperProdFreeRelease --no-daemon

      - name: Package AAB and mappings
        id: package
        run: |
          FILE_NAME="${{ steps.version.outputs.file_name }}"
          VARIANT_DIR="prodFreeRelease"
          PACKAGE_DIR="release-package"
          PROTECTED_AAB_NAME="${{ steps.version.outputs.project_id }}-reschiper.aab"
          PROTECTED_AAB_NAME="${PROTECTED_AAB_NAME// /-}"
          AAB_SOURCE="app/build/outputs/bundle/${VARIANT_DIR}/${PROTECTED_AAB_NAME}"
          R8_MAPPING="app/build/outputs/mapping/${VARIANT_DIR}/mapping.txt"
          RESOURCE_MAPPING="app/build/outputs/bundle/${VARIANT_DIR}/resources-mapping.txt"

          if [ ! -f "$AAB_SOURCE" ]; then
            echo "::error::Protected ResChiper AAB not found: $AAB_SOURCE"
            exit 1
          fi
          if [ ! -f "$R8_MAPPING" ]; then
            echo "::error::R8 mapping not found: $R8_MAPPING"
            exit 1
          fi
          if [ ! -f "$RESOURCE_MAPPING" ]; then
            echo "::error::ResChiper resource mapping not found: $RESOURCE_MAPPING"
            exit 1
          fi

          mkdir -p "$PACKAGE_DIR/mapping"
          cp "$AAB_SOURCE" "$PACKAGE_DIR/${FILE_NAME}.aab"
          cp "$R8_MAPPING" "$PACKAGE_DIR/mapping/r8-mapping.txt"
          cp "$RESOURCE_MAPPING" "$PACKAGE_DIR/mapping/resources-mapping.txt"
          zip -r "${FILE_NAME}.zip" "$PACKAGE_DIR"

          echo "zip_name=${FILE_NAME}.zip" >> $GITHUB_OUTPUT
          echo "zip_path=${FILE_NAME}.zip" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file_name }}
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 14

      - name: Build Summary
        run: |
          SHA1_STATUS="${{ steps.sha1_check.outputs.sha1_status }}"
          FILE_NAME="${{ steps.version.outputs.file_name }}"

          {
            echo "---"
            echo "## 📦 Build Complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App         | ${{ steps.version.outputs.app_name }}                              |"
            echo "| Project     | ${{ steps.version.outputs.project_id }}                              |"
            echo "| Version     | v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }}) |"
            echo "| Flavor      | \`${{ steps.version.outputs.flavor_name }}\`                         |"
            echo "| Build type  | \`release\`                         |"
            echo "| Branch      | \`${{ github.ref_name }}\`                             |"
            echo "| Output file | \`${FILE_NAME}.zip\`                                              |"
            echo "| Protection  | R8 + StringFog + ResChiper                                |"
            echo "| Mappings    | R8 and ResChiper mappings included in ZIP                  |"
          } >> $GITHUB_STEP_SUMMARY
